name: carlog
description: Дневник обслуживания автомобиля
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # База данных
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0

  # Состояние
  provider: ^6.1.0

  # Уведомления
  flutter_local_notifications: ^17.0.0

  # Экспорт/импорт
  file_picker: ^8.0.0
  share_plus: ^10.0.0

  # Иконки Material Symbols (опционально)
  material_symbols_icons: ^4.2700.0
  sqflite_common_ffi: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true